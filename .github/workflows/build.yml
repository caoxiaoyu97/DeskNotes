name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Storage and report tests
        run: dotnet run --project tests/DeskNotes.Tests/DeskNotes.Tests.csproj -c Release
      - name: Build app
        run: dotnet build src/DeskNotes.App/DeskNotes.App.csproj -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish portable build
        run: dotnet publish src/DeskNotes.App/DeskNotes.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist
      - name: Package
        run: Compress-Archive -Path dist/* -DestinationPath DeskNotes-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: DeskNotes-win-x64.zip
